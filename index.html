        const bracketKeys = (obj, v) => {
            const ks = Object.keys(obj).map(Number).sort((a, b) => a - b);
            const c = Math.max(ks[0], Math.min(ks[ks.length - 1], v));
            for (let i = 0; i < ks.length - 1; i++) if (c >= ks[i] && c <= ks[i + 1]) return [ks[i], ks[i + 1], (c - ks[i]) / (ks[i + 1] - ks[i])];
            return [ks[0], ks[0], 0];
        };
        // RFM 차트 읽기: TQ에서 내려가 기압고도 선과 만나는 높이 → 오른쪽으로 OAT 곡선과 만나는 곳 → 위로 허용 ITT·NG
        const computePA = (tq, pa, oat) => {
            const warn = [];
            if (tq < 90 || tq > 105) warn.push('TQ가 차트 범위(90~105%) 밖');
            if (pa < -1000 || pa > 14000) warn.push('PA가 차트 범위(−1,000~14,000ft) 밖');
            if (oat < -40 || oat > 50) warn.push('OAT가 차트 범위(−40~50°C) 밖');
            const t = Math.max(90, Math.min(105, tq));
            const [pa0, pa1, pf] = bracketKeys(RFM_PA.pa, pa);
            const ya = polyYatX(RFM_PA.pa[pa0], t), yb = polyYatX(RFM_PA.pa[pa1], t);
            const y = ya == null || yb == null ? null : ya + (yb - ya) * pf;
            const read = (set) => {
                if (y == null) return null;
                const [o0, o1, of] = bracketKeys(set, oat);
                const xa = polyXatY(set[o0], y), xb = polyXatY(set[o1], y);
                return xa == null || xb == null ? null : xa + (xb - xa) * of;
            };
            const maxItt = read(RFM_PA.itt), maxNg = read(RFM_PA.ng);
            if (y != null && (maxItt == null || maxNg == null)) warn.push('이 OAT 곡선이 이 높이까지 그려져 있지 않음(차트 범위 밖)');
            return { y, maxItt, maxNg, warn };
        };

        // 드래그용 역계산: 높이 y → PA(지금 TQ에서), 허용선 x → OAT(지금 높이에서)
        const paFromY = (tq, y) => {
            const ks = Object.keys(RFM_PA.pa).map(Number).sort((a, b) => a - b);
            const ys = ks.map(k => polyYatX(RFM_PA.pa[k], tq));
            if (y >= ys[0]) return ks[0];
            if (y <= ys[ys.length - 1]) return ks[ks.length - 1];
            for (let i = 0; i < ks.length - 1; i++) if (y <= ys[i] && y >= ys[i + 1]) return ks[i] + (ys[i] - y) / (ys[i] - ys[i + 1]) * (ks[i + 1] - ks[i]);
            return null;
        };
        const oatFromX = (set, y, x) => {
            const ks = Object.keys(set).map(Number).sort((a, b) => a - b).filter(k => polyXatY(set[k], y) != null);
            if (!ks.length) return null;
            const xs = ks.map(k => polyXatY(set[k], y));
            if (x <= xs[0]) return ks[0];
            if (x >= xs[xs.length - 1]) return ks[ks.length - 1];
            for (let i = 0; i < ks.length - 1; i++) if (x >= xs[i] && x <= xs[i + 1]) return ks[i] + (x - xs[i]) / (xs[i + 1] - xs[i]) * (ks[i + 1] - ks[i]);
            return null;
        };

        const PA_COL = { tq: '#a855f7', pa: '#ef4444', max: '#f97316' };
        const PaChart = ({ tq, pa, res, engines, onDrag, svgRef }) => {
            const C = PA_CH, top = C.top, bot = C.bot;
            const blue = '#1e40af';
            const panel = (ax, key) => {
                const xs = [];
                for (let v = ax.v0; v <= ax.v1 + 1e-9; v += ax.minor) xs.push(+v.toFixed(4));
                const ys = [];
                for (let y = top; y <= bot + 0.01; y += C.minorY) ys.push(y);
                return (
                    <g key={key}>
                        <rect x={ax.x0} y={top} width={ax.x1 - ax.x0} height={bot - top} fill="#fff" />
                        {xs.map(v => { const maj = Math.abs(v / ax.major - Math.round(v / ax.major)) < 1e-6; return <line key={`v${v}`} x1={paX(ax, v)} y1={top} x2={paX(ax, v)} y2={bot} stroke={maj ? '#94a3b8' : '#dbeafe'} strokeWidth={maj ? 0.45 : 0.3} />; })}
                        {ys.map((y, i) => <line key={`h${i}`} x1={ax.x0} y1={y} x2={ax.x1} y2={y} stroke={i % 5 === 0 ? '#94a3b8' : '#dbeafe'} strokeWidth={i % 5 === 0 ? 0.45 : 0.3} />)}
                        <rect x={ax.x0} y={top} width={ax.x1 - ax.x0} height={bot - top} fill="none" stroke="#475569" strokeWidth="0.8" />
                        {ax.ticks.map(v => <text key={`t${v}`} x={paX(ax, v)} y={top - 4} textAnchor="middle" fontSize="7" fontWeight="700" fill="#334155">{v}</text>)}
                    </g>
                );
            };
            const pathOf = (pts, ax) => pts.map(([v, y], i) => `${i ? 'L' : 'M'}${paX(ax, v).toFixed(2)} ${y.toFixed(2)}`).join(' ');
            const labelOn = (pts, ax, yWant, text, key) => {   // 곡선 위 글자(기울기 따라 회전)
                let best = 0; pts.forEach((p, i) => { if (Math.abs(p[1] - yWant) < Math.abs(pts[best][1] - yWant)) best = i; });
                const i2 = Math.min(pts.length - 1, best + 1), i1 = Math.max(0, i2 - 1);
                const x1 = paX(ax, pts[i1][0]), y1 = pts[i1][1], x2 = paX(ax, pts[i2][0]), y2 = pts[i2][1];
                let ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI; if (ang > 90) ang -= 180; if (ang < -90) ang += 180;
                const cx = paX(ax, pts[best][0]), cy = pts[best][1];
                return <text key={key} x={cx} y={cy} transform={`rotate(${ang.toFixed(1)} ${cx} ${cy})`} dy="-1.5" textAnchor="middle" fontSize="5.5" fill={blue}>{text}</text>;
            };
            const tx = paX(C.tq, Math.max(90, Math.min(105, tq)));
            const ix = res.maxItt != null ? paX(C.itt, res.maxItt) : null, nx = res.maxNg != null ? paX(C.ng, res.maxNg) : null;
            return (
                <svg ref={svgRef} viewBox="80 214 686 300" className="w-full h-auto block select-none" role="img" aria-label="RFM Hover Power Check Chart">
                    {[['ENGINE TORQUE TQ (%)', C.tq], ['MAXIMUM ALLOWABLE ITT (°C)', C.itt], ['MAXIMUM ALLOWABLE NG (%)', C.ng]].map(([t, ax]) => (
                        <text key={t} x={(ax.x0 + ax.x1) / 2} y={223} textAnchor="middle" fontSize="7.5" fontWeight="700" fill="#0f172a">{t}</text>
                    ))}
                    {panel(C.tq, 'tq')}{panel(C.itt, 'itt')}{panel(C.ng, 'ng')}
                    {/* RFM 선 */}
                    <g fill="none" stroke={blue} strokeWidth="0.75" strokeLinejoin="round">
                        {Object.entries(RFM_PA.pa).map(([k, pts]) => <path key={`p${k}`} d={pathOf(pts, C.tq)} />)}
                        {Object.entries(RFM_PA.itt).map(([k, pts]) => <path key={`i${k}`} d={pathOf(pts, C.itt)} />)}
                        {Object.entries(RFM_PA.ng).map(([k, pts]) => <path key={`n${k}`} d={pathOf(pts, C.ng)} />)}
                    </g>
                    {Object.entries(RFM_PA.pa).map(([k, pts]) => { const y = polyYatX(pts, 92); const y2 = polyYatX(pts, 93);
                        const ang = Math.atan2(y2 - y, paX(C.tq, 93) - paX(C.tq, 92)) * 180 / Math.PI, cx = paX(C.tq, 92.5), cy = (y + y2) / 2;
                        return <text key={`pl${k}`} x={cx} y={cy} dy="-1.5" transform={`rotate(${ang.toFixed(1)} ${cx} ${cy})`} textAnchor="middle" fontSize="5.5" fill={blue}>{Number(k).toLocaleString()}</text>; })}
                    <text x={paX(C.tq, 101.5)} y={500} textAnchor="middle" fontSize="5.5" fill={blue}>PRESSURE ALT (ft)</text>
                    {Object.entries(RFM_PA.itt).map(([k, pts]) => labelOn(pts, C.itt, 492, k, `il${k}`))}
                    {Object.entries(RFM_PA.ng).map(([k, pts]) => labelOn(pts, C.ng, 492, k, `nl${k}`))}
                    <text x={paX(C.itt, 790)} y={500} textAnchor="middle" fontSize="5.5" fill={blue}>OAT (°C)</text>
                    <text x={paX(C.ng, 102)} y={500} textAnchor="middle" fontSize="5.5" fill={blue}>OAT (°C)</text>
                    {/* 엔진 측정값 */}
                    {engines.filter(e => e.on).map(e => {
                        const inI = isFinite(e.itt) && e.itt >= C.itt.v0 && e.itt <= C.itt.v1, inN = isFinite(e.ng) && e.ng >= C.ng.v0 && e.ng <= C.ng.v1;
                        const lab = (x, t) => <text x={x} y={top + 18} textAnchor="middle" fontSize="7" fontWeight="700" fill={e.dark} stroke="#fff" strokeWidth="2" paintOrder="stroke">{t}</text>;
                        return (
                            <g key={e.n}>
                                {inI && <line x1={paX(C.itt, e.itt)} y1={top} x2={paX(C.itt, e.itt)} y2={bot} stroke={e.color} strokeWidth="1.1" />}
                                {inN && <line x1={paX(C.ng, e.ng)} y1={top} x2={paX(C.ng, e.ng)} y2={bot} stroke={e.color} strokeWidth="1.1" />}
                                {inI && lab(paX(C.itt, e.itt), `${e.itt}`)}
                                {inN && lab(paX(C.ng, e.ng), `${e.ng}`)}
                            </g>
                        );
                    })}
                    {/* 읽는 선 (끌어서 값 변경): TQ 보라 · PA 빨강 · 허용 ITT/NG 주황 */}
                    <line x1={tx} y1={top} x2={tx} y2={bot} stroke={PA_COL.tq} strokeWidth="1.3" />
                    {res.y != null && <line x1={C.tq.x0} y1={res.y} x2={C.ng.x1} y2={res.y} stroke={PA_COL.pa} strokeWidth="1.3" />}
                    {ix != null && <line x1={ix} y1={top} x2={ix} y2={bot} stroke={PA_COL.max} strokeWidth="1.3" />}
                    {nx != null && <line x1={nx} y1={top} x2={nx} y2={bot} stroke={PA_COL.max} strokeWidth="1.3" />}
                    {res.y != null && <circle cx={tx} cy={res.y} r="2" fill={PA_COL.pa} />}
                    <text x={tx} y={top + 9} textAnchor="middle" fontSize="7" fontWeight="700" fill="#7e22ce" stroke="#fff" strokeWidth="2" paintOrder="stroke">{Number(tq).toFixed(1)}%</text>
                    {res.y != null && <text x={C.tq.x0 + 2} y={res.y - 2.5} fontSize="7" fontWeight="700" fill="#b91c1c" stroke="#fff" strokeWidth="2" paintOrder="stroke">{Math.round(pa).toLocaleString()} ft</text>}
                    {ix != null && <text x={ix} y={top + 9} textAnchor="middle" fontSize="7" fontWeight="700" fill="#c2410c" stroke="#fff" strokeWidth="2" paintOrder="stroke">{Math.round(res.maxItt)}</text>}
                    {nx != null && <text x={nx} y={top + 9} textAnchor="middle" fontSize="7" fontWeight="700" fill="#c2410c" stroke="#fff" strokeWidth="2" paintOrder="stroke">{res.maxNg.toFixed(1)}</text>}
                    {/* 잡기 영역(투명, 굵게) */}
                    {onDrag && <g stroke="transparent" strokeWidth="9" style={{ touchAction: 'none' }}>
                        <line x1={tx} y1={top} x2={tx} y2={bot} style={{ cursor: 'ew-resize' }} onPointerDown={onDrag('tq')} />
                        {res.y != null && <line x1={C.tq.x0} y1={res.y} x2={C.ng.x1} y2={res.y} style={{ cursor: 'ns-resize' }} onPointerDown={onDrag('pa')} />}
                        {ix != null && <line x1={ix} y1={top} x2={ix} y2={bot} style={{ cursor: 'ew-resize' }} onPointerDown={onDrag('itt')} />}
                        {nx != null && <line x1={nx} y1={top} x2={nx} y2={bot} style={{ cursor: 'ew-resize' }} onPointerDown={onDrag('ng')} />}
                    </g>}
                    <text x="86" y="512" fontSize="5.5" fill="#94a3b8">RFM Section 4 Figure 4-5 · PWC PT6C-67C Hover Power Check Chart (NR=100%)</text>
                </svg>
            );
        };

        // ======================= PA APP =======================
        const PAApp = ({ onSwitchMode }) => {
            const [inputs, setInputs] = useState(() => {
                const d = { pa: 0, oat: 15, tq: 95, actual_itt1: 680, actual_ng1: 96.0, actual_itt2: 680, actual_ng2: 96.0 };
                try { const s = JSON.parse(localStorage.getItem('aw139_pa_inputs')); if (s && typeof s === 'object') return { ...d, ...s }; } catch {}
                return d;
            });
            useEffect(() => { try { localStorage.setItem('aw139_pa_inputs', JSON.stringify(inputs)); } catch {} }, [inputs]);
            const setIn = (k) => (v) => setInputs(p => ({ ...p, [k]: v }));
            const res = useMemo(() => computePA(inputs.tq, inputs.pa, inputs.oat), [inputs.tq, inputs.pa, inputs.oat]);
            // 차트 선 끌기: 화면 좌표 → 차트 좌표(getScreenCTM, zoom 포함) → 값 역계산
            const svgRef = useRef(null);
            const startDrag = (kind) => (ev) => {
                ev.preventDefault();
                const svg = svgRef.current; if (!svg) return;
                const toChart = (e) => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
                const move = (e) => {
                    const p = toChart(e);
                    setInputs(prev => {
                        const C = PA_CH;
                        if (kind === 'tq') {
                            const v = C.tq.v0 + (p.x - C.tq.x0) / (C.tq.x1 - C.tq.x0) * (C.tq.v1 - C.tq.v0);
                            return { ...prev, tq: Math.round(Math.max(90, Math.min(105, v)) * 10) / 10 };
                        }
                        if (kind === 'pa') {
                            const v = paFromY(Math.max(90, Math.min(105, prev.tq)), Math.max(C.top, Math.min(C.bot, p.y)));
                            return v == null ? prev : { ...prev, pa: Math.round(v / 50) * 50 };
                        }
                        const r = computePA(prev.tq, prev.pa, prev.oat);
                        if (r.y == null) return prev;
                        const ax = kind === 'itt' ? C.itt : C.ng, set = kind === 'itt' ? RFM_PA.itt : RFM_PA.ng;
                        const v = oatFromX(set, r.y, ax.v0 + (p.x - ax.x0) / (ax.x1 - ax.x0) * (ax.v1 - ax.v0));
                        return v == null ? prev : { ...prev, oat: Math.round(v * 2) / 2 };
                    });
                };
                const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); };
                window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
            };
            const results = {
                ...inputs,
                max_itt: res.maxItt != null ? Math.round(res.maxItt) : null,
                max_ng: res.maxNg != null ? Math.round(res.maxNg * 10) / 10 : null,
            };
            const [activeEngine, setActiveEngine] = useState(1);
            const eng1Checked = activeEngine === 1, eng2Checked = activeEngine === 2;
            const over = (mx, a) => mx != null && mx - a < 0;
            const isAbnormal1 = over(results.max_itt, results.actual_itt1) || over(results.max_ng, results.actual_ng1);
            const isAbnormal2 = over(results.max_itt, results.actual_itt2) || over(results.max_ng, results.actual_ng2);
            const isAbnormal = isAbnormal1 || isAbnormal2;
            const unknown = results.max_itt == null || results.max_ng == null;

            const [aiAnalysis, setAiAnalysis] = useState("");
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [showAiModal, setShowAiModal] = useState(false);
            const analyzeWithGemini = async () => {
                setIsAnalyzing(true);
                setAiAnalysis("");
                setShowAiModal(true);
                const apiKey = "";
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

                const statusStr = isAbnormal ? "비정상(ABNORMAL)" : "정상(NORMAL)";
                const prompt = `당신은 Leonardo AW139 정비 전문가입니다. 다음 PA 체크 결과를 분석해주세요.
                고도: ${results.pa}ft, 외기온도: ${results.oat}°C, 토크: ${results.tq}%.
                #1엔진 - ITT 실제: ${results.actual_itt1}°C (최대허용: ${results.max_itt}), NG 실제: ${results.actual_ng1}% (최대허용: ${results.max_ng}).
                #2엔진 - ITT 실제: ${results.actual_itt2}°C (최대허용: ${results.max_itt}), NG 실제: ${results.actual_ng2}% (최대허용: ${results.max_ng}).
                현재 판정은 ${statusStr}입니다. 정비사의 관점에서 각 엔진별 성능 요약과 필요한 조치 사항을 한국어로 3-4문장 이내로 전문적으로 설명해주세요.`;

                const fetchWithRetry = async (retries = 0) => {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                        });
                        if (!response.ok) throw new Error('API Error');
                        const data = await response.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text;
                    } catch (err) {
                        if (retries < 5) {
                            const delay = Math.pow(2, retries) * 1000;
                            await new Promise(res => setTimeout(res, delay));
                            return fetchWithRetry(retries + 1);
                        }
                        throw err;
                    }
                };

                try {
                    const text = await fetchWithRetry();
                    setAiAnalysis(text || "분석 결과를 생성할 수 없습니다.");
                } catch (error) {
                    setAiAnalysis("AI 분석 도중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
                } finally {
                    setIsAnalyzing(false);
                }
            };

            useEffect(() => { lucide.createIcons(); }, [showAiModal]);

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header (CG와 통일된 다크 테마, 동일 높이) */}
                    <header className="bg-slate-900 text-white px-4 sm:px-6 py-4 shadow-lg sticky top-0 z-50 print:relative print:bg-white print:text-black print:shadow-none print:border-b-2 print:border-slate-800">
                        <div className="max-w-7xl mx-auto w-full flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3 w-full sm:w-auto">
                                <div className="p-2 bg-blue-600 rounded-lg text-xl print:hidden">📊</div>
                                <div>
                                    <h1 className="text-base sm:text-xl font-black tracking-tight uppercase leading-none">AW139 Engine Performance</h1>
                                    <div className="flex items-center gap-3 mt-1.5 font-bold">
                                        <span className="text-[10px] text-slate-400 uppercase tracking-tighter font-bold">Power Assurance Check</span>
                                        <span className="text-[10px] text-slate-400 uppercase tracking-tighter font-bold">Incheon 119 Fire Aviation Unit</span>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto no-print">
                                <AppNav currentMode="pa" onSwitchMode={onSwitchMode} />
                                <div className="flex gap-2">
                                    <button onClick={() => window.print()} className="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg text-[10px] font-black shadow-md transition-all active:scale-95"><Icon name="file-text" size={16} /><span className="hidden sm:inline">PDF 저장</span></button>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 flex flex-col">
                        <div className="p-3 sm:p-5 print-chart-area">
                            <div className="max-w-6xl mx-auto bg-white rounded-xl border border-slate-200 p-3 sm:p-4">
                                <details className="mb-2 no-print">
                                    <summary className="text-[10px] font-bold text-slate-500 cursor-pointer select-none">RFM 절차 보기 — 호버 비행 Power Assurance Check (NR=100%) · 차트의 보라(TQ)·빨강(PA)·주황(허용 ITT/NG→OAT) 선은 끌어서 바꿀 수 있습니다</summary>
                                    <ol className="mt-1.5 ml-4 list-decimal text-[10.5px] text-slate-600 leading-relaxed space-y-0.5">
                                        <li>HEATER/COND OFF, GENERATOR LOAD 최소(17% 미만), NR 100%로 설정</li>
                                        <li>점검 엔진(TEST ENGINE) MODE SWITCH: FLIGHT / 다른 엔진 MODE SWITCH: IDLE</li>
                                        <li>바퀴가 가벼워질 때(LIGHT ON WHEELS)까지, 또는 5ft 높이에서 기수를 바람 쪽으로 두고 호버링할 때까지 콜렉티브를 올림. ITT 775°C, NG 102.4%, TQ 105%를 넘지 말 것</li>
                                        <li>출력을 1분간 안정시킨 뒤 OAT, 기압고도, 엔진 TQ, ITT, NG를 기록</li>
                                        <li>차트에 지시 TQ로 들어가 아래로 내려가 기압고도 선과 만나고, 오른쪽으로 가서 OAT 선과 만난 뒤, 위로 올라가 최대 허용 ITT와 NG를 읽음</li>
                                        <li>지시 ITT나 NG가 최대 허용치를 넘으면 점검을 반복. 다른 엔진도 같은 방법으로 점검</li>
                                        <li>어느 엔진이든 허용 ITT나 NG를 넘으면 발간된 성능이 나오지 않을 수 있음. EMM 참조</li>
                                    </ol>
                                </details>
                                <div className="overflow-x-auto">
                                    <div className="min-w-[640px]">
                                        <PaChart tq={inputs.tq} pa={inputs.pa} res={res} svgRef={svgRef} onDrag={startDrag}
                                            engines={[{ n: 1, on: eng1Checked, color: '#10b981', dark: '#047857', itt: inputs.actual_itt1, ng: inputs.actual_ng1 },
                                                      { n: 2, on: eng2Checked, color: '#06b6d4', dark: '#0e7490', itt: inputs.actual_itt2, ng: inputs.actual_ng2 }]} />
                                    </div>
                                </div>
                                {res.warn.length > 0 && (
                                    <div className="mt-2 px-2.5 py-1.5 rounded-md border border-amber-300 bg-amber-50 text-[11px] text-amber-800">⚠ {res.warn.join(' · ')}</div>
                                )}
                            </div>
                        </div>
                        <div className="bg-white border-t border-slate-200 px-3 py-2.5 z-10 shrink-0 sticky bottom-0 no-print-sticky">
                            <div className="max-w-6xl mx-auto flex flex-col lg:flex-row gap-2 lg:gap-3 lg:items-stretch">
                                {/* 입력값 */}
                                <div className="grid grid-cols-3 lg:flex lg:flex-col gap-1.5 lg:w-44 lg:shrink-0">
                                    <EditableInputCard label="TQ" value={results.tq} unit="%" color="#a855f7" onCommit={setIn('tq')} min={90} max={105} step={0.1} />
                                    <EditableInputCard label="PA" value={results.pa} unit="ft" color="#ef4444" onCommit={setIn('pa')} min={-1000} max={14000} step={100} />
                                    <EditableInputCard label="OAT" value={results.oat} unit="°C" color="#f97316" onCommit={setIn('oat')} min={-50} max={60} step={1} />
                                </div>
                                {/* 엔진별 결과 */}
                                <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    {[
                                        { n: 1, abn: isAbnormal1, on: eng1Checked, dot: '#10b981', itt: 'actual_itt1', ng: 'actual_ng1' },
                                        { n: 2, abn: isAbnormal2, on: eng2Checked, dot: '#06b6d4', itt: 'actual_itt2', ng: 'actual_ng2' },
                                    ].map(e => (
                                        <div key={e.n} className={`rounded-lg border p-2 ${e.abn ? 'border-red-200 bg-red-50/40' : 'border-slate-200 bg-white'}`}>
                                            <div className="flex items-center justify-between mb-1.5">
                                                <button onClick={() => setActiveEngine(v => v === e.n ? null : e.n)} title="차트에 이 엔진 측정값 표시"
                                                    className="flex items-center gap-1.5 text-[10px] font-black text-slate-700 uppercase tracking-wider">
                                                    <span className="w-2.5 h-2.5 rounded-full border-2" style={{ borderColor: e.dot, background: e.on ? e.dot : 'transparent' }} />
                                                    #{e.n} Engine
                                                    <span className="text-[9px] font-medium text-slate-400 normal-case tracking-normal">{e.on ? '차트 표시 중' : ''}</span>
                                                </button>
                                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-black border ${e.abn ? 'border-red-400 text-red-700 bg-red-50' : unknown ? 'border-amber-400 text-amber-700 bg-amber-50' : 'border-emerald-400 text-emerald-700 bg-emerald-50'}`}>
                                                    {e.abn ? '한계 초과' : unknown ? '판정 불가' : '정상'}
                                                </span>
                                            </div>
                                            <ComparisonRow label="ITT" actual={results[e.itt]} max={results.max_itt ?? '—'} margin={results.max_itt == null ? NaN : (results.max_itt - results[e.itt]).toFixed(1)} unit="°C" onChangeActual={setIn(e.itt)} />
                                            <ComparisonRow label="NG" actual={results[e.ng]} max={results.max_ng ?? '—'} margin={results.max_ng == null ? NaN : (results.max_ng - results[e.ng]).toFixed(1)} unit="%" onChangeActual={setIn(e.ng)} />
                                        </div>
                                    ))}
                                </div>
                                <button onClick={analyzeWithGemini} className="shrink-0 w-full h-8 lg:w-16 lg:h-auto bg-white border border-slate-300 hover:border-slate-500 text-slate-600 rounded-lg flex flex-row lg:flex-col items-center justify-center gap-1.5 lg:gap-1">
                                    <Icon name="sparkles" size={14} />
                                    <span className="text-[10px] font-bold">AI 분석</span>
                                </button>
                            </div>
                        </div>


                        {showAiModal && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
                                <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden fade-in">
                                    <div className="bg-slate-900 p-4 flex justify-between items-center text-white">
                                        <div className="flex items-center gap-2">
                                            <Icon name="sparkles" className="text-blue-400" />
                                            <span className="font-bold">✨ Smart AI Maintenance Insights</span>
                                        </div>
                                        <button onClick={() => setShowAiModal(false)} className="hover:bg-white/20 p-1 rounded-full"><Icon name="x" /></button>
                                    </div>
                                    <div className="p-6">
                                        {isAnalyzing ? (
                                            <div className="flex flex-col items-center gap-4 py-8">
                                                <div className="w-12 h-12 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin"></div>
                                                <p className="text-sm font-medium text-slate-500 animate-pulse">차트 데이터를 바탕으로 정밀 분석 중...</p>
                                            </div>
                                        ) : (
                                            <div className="space-y-4">
                                                <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 text-sm leading-relaxed text-slate-700">
                                                    {aiAnalysis}
                                                </div>
                                                <p className="text-[10px] text-slate-400 text-center uppercase tracking-tighter">*이 분석은 참고용이며, 최종 정비 판단은 공식 AMM 및 기종 정비사의 지침을 따르십시오.</p>
                                                <button onClick={() => setShowAiModal(false)} className="w-full py-2.5 bg-slate-800 text-white rounded-lg font-bold text-sm hover:bg-slate-900 transition-all">확인</button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const EditableInputCard = ({ label, value, unit, color, onCommit, min, max, step, tooltip }) => {
            const [draft, setDraft] = React.useState(String(value));
            const [showTip, setShowTip] = React.useState(false);
            const focused = React.useRef(false);
            React.useEffect(() => { if (!focused.current) setDraft(String(value)); }, [value]);
            const commit = () => { const n = parseFloat(draft); if (!isNaN(n)) onCommit(n); };
            return (
                <div className="bg-white rounded-md border border-slate-300 px-2 py-1 flex justify-between items-center h-8 focus-within:border-slate-600" style={{ boxShadow: `inset 3px 0 0 ${color}` }}>
                    <div className="flex items-center gap-1 min-w-0 pl-1">
                        <span className="text-[9px] font-bold text-slate-500 truncate">{label}</span>
                        {tooltip && (
                            <span
                                onMouseEnter={() => setShowTip(true)}
                                onMouseLeave={() => setShowTip(false)}
                                onClick={() => setShowTip(v => !v)}
                                className="relative text-amber-500 cursor-help shrink-0 flex items-center"
                            >
                                <Icon name="info" size={11} />
                                {showTip && (
                                    <div className="absolute left-1/2 -translate-x-1/2 bottom-full mb-2 z-50 w-60 p-2.5 bg-slate-900 text-white text-[10px] font-medium leading-relaxed rounded-lg shadow-xl border border-slate-700 normal-case tracking-normal pointer-events-none whitespace-normal">
                                        {tooltip}
                                        <div className="absolute left-1/2 -translate-x-1/2 top-full w-0 h-0 border-l-[5px] border-r-[5px] border-t-[5px] border-l-transparent border-r-transparent border-t-slate-900"></div>
                                    </div>
                                )}
                            </span>
                        )}
                    </div>
                    <div className="flex items-baseline gap-0.5">
                        <input type="number" value={draft} min={min} max={max} step={step}
                            onChange={e => setDraft(e.target.value)}
                            onFocus={() => { focused.current = true; }}
                            onBlur={() => { focused.current = false; commit(); }}
                            onKeyDown={e => e.key === 'Enter' && commit()}
                            className="text-sm font-bold font-mono text-slate-800 bg-transparent w-16 text-right outline-none" />
                        <span className="text-[9px] text-slate-400">{unit}</span>
                    </div>
                </div>
            );
        };

        const InputCard = ({ label, value, unit, color }) => (
            <div className={`bg-slate-50 rounded border-l-4 ${color} px-3 py-1 flex justify-between items-center h-7 shadow-sm`}>
                <span className="text-[9px] font-bold text-slate-400 uppercase truncate">{label}</span>
                <div className="flex items-baseline gap-0.5"><span className="text-sm font-black text-slate-700">{value}</span><span className="text-[8px] font-bold text-slate-300">{unit}</span></div>
            </div>
        );

        const ComparisonRow = ({ label, actual, max, margin, unit, onChangeActual }) => {
            const [draft, setDraft] = React.useState(String(actual));
            const focused = React.useRef(false);
            React.useEffect(() => { if (!focused.current) setDraft(String(actual)); }, [actual]);
            const commit = () => { const n = parseFloat(draft); if (!isNaN(n) && onChangeActual) onChangeActual(n); };
            const m = parseFloat(margin), known = !isNaN(m), ok = m >= 0;
            return (
                <div className="grid grid-cols-[2.2rem_1fr_1fr_1.15fr] gap-1.5 items-center mb-1 last:mb-0">
                    <span className="text-[10px] font-black text-slate-500">{label}</span>
                    <div className="flex items-center border border-slate-300 rounded-md px-1.5 h-7 bg-white focus-within:border-slate-600">
                        <span className="text-[8px] text-slate-400 mr-1 shrink-0">측정</span>
                        <input type="number" value={draft}
                            onChange={e => setDraft(e.target.value)}
                            onFocus={() => { focused.current = true; }}
                            onBlur={() => { focused.current = false; commit(); }}
                            onKeyDown={e => e.key === 'Enter' && commit()}
                            className="text-xs font-bold font-mono text-slate-800 bg-transparent w-full min-w-0 text-right outline-none" />
                        <span className="text-[8px] text-slate-400 ml-0.5 shrink-0">{unit}</span>
                    </div>
                    <div className="flex items-center justify-between rounded-md px-1.5 h-7 bg-slate-50 border border-slate-200">
                        <span className="text-[8px] text-slate-400">허용</span>
                        <span className="text-xs font-bold font-mono text-slate-700">{max}<span className="text-[8px] text-slate-400 ml-0.5">{unit}</span></span>
                    </div>
                    <div className={`flex items-center justify-between rounded-md px-1.5 h-7 border ${!known ? 'bg-slate-50 border-slate-200 text-slate-400' : ok ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-red-50 border-red-300 text-red-700'}`}
                         title="여유 = 허용치 − 측정값">
                        <span className="text-[8px] font-bold">{!known ? '여유' : ok ? '여유' : '초과'}</span>
                        <span className="text-xs font-black font-mono">{!known ? '—' : ok ? `+${Math.abs(m).toFixed(1)}` : Math.abs(m).toFixed(1)}</span>
                    </div>
                </div>
            );
        };

        // ======================= ROOT (모드 전환) =======================
        const Root = () => {
            const [mode, setMode] = useState(() => window.location.hash === '#pa' ? 'pa' : 'cg');
            return mode === 'cg'
                ? <CGApp onSwitchMode={() => setMode('pa')} />
                : <PAApp onSwitchMode={() => setMode('cg')} />;
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<Root />);
    </script>
</body>
</html>
