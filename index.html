<!DOCTYPE html>
<html lang="ko">
<head>

    <title>Incheon 119 Fire Aviation Unit - AW139 W&B / PA</title>
    <script src="libs/tailwind.js"></script>

    <script src="libs/prop-types.min.js"></script>

    <style>
        body { font-family: 'Apple SD Gothic Neo','Malgun Gothic',sans-serif; -webkit-print-color-adjust: exact; overflow-x: hidden; }
        @media screen { body { zoom: 0.85; } }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { opacity: 1; }
        .canvas-container { touch-action: none; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media print {
            @page { size: A4 landscape; margin: 5mm; }
            .no-print { display: none !important; }
            body { background-color: white !important; padding: 0 !important; }
            html, body { overflow: visible !important; height: auto !important; }
            .shadow-lg, .shadow-md, .shadow-xl, .shadow-2xl, .shadow-sm, .shadow { box-shadow: none !important; }
            .rounded-2xl, .rounded-3xl { border-radius: 0 !important; border: 1px solid #e2e8f0 !important; }
            .print-grid-layout { display: grid !important; grid-template-columns: 1.2fr 0.8fr !important; gap: 15px !important; }
            main { padding: 0 !important; max-width: 100% !important; overflow: visible !important; height: auto !important; flex: none !important; }
            section { page-break-inside: avoid; }
            .chart-container svg { max-height: 380px; width: auto; margin: 0 auto; }
            #root > div { height: auto !important; min-height: unset !important; }
            .print-chart-area { overflow: visible !important; height: auto !important; padding: 0 !important; background: white !important; align-items: flex-start !important; justify-content: center !important; page-break-inside: avoid !important; }
            .print-chart-container { width: auto !important; max-width: 100% !important; max-height: 135mm !important; box-shadow: none !important; border: none !important; }
            .print-chart-container > img { width: auto !important; height: 135mm !important; max-width: 100% !important; display: block !important; }
            .print-chart-container > canvas { width: 100% !important; height: 100% !important; }
            canvas { display: block !important; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .modal-enter { animation: fadeIn 0.2s ease-out; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        const Icon = ({ name, size = 16, className = "" }) => {
            useEffect(() => { if (window.lucide) lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const AppNav = ({ currentMode, onSwitchMode }) => {
            const [dropdownOpen, setDropdownOpen] = useState(false);
            const dropdownRef = useRef(null);

            useEffect(() => {
                if (!dropdownOpen) return;
                const handlePointerDown = (e) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
                        setDropdownOpen(false);
                    }
                };
                document.addEventListener('pointerdown', handlePointerDown);
                return () => document.removeEventListener('pointerdown', handlePointerDown);
            }, [dropdownOpen]);

            useEffect(() => {
                if (dropdownOpen && window.lucide) {
                    setTimeout(() => {
                        try { lucide.createIcons(); } catch (err) {}
                    }, 10);
                }
            }, [dropdownOpen]);

            const navItems = [
                { id: 'wb', label: 'W&B', icon: '🚁', type: 'mode' },
                { id: 'pa', label: 'Engine PA', icon: '📊', type: 'mode' },
                { id: 'e6b', label: 'E6B', icon: '🧮', type: 'link', href: 'e6b.html' },
                { id: 'motoring', label: 'Motoring', icon: '⏱️', type: 'link', href: 'motoring.html' },
                { id: 'mcdu', label: 'MCDU Sim', icon: '🎛️', type: 'link', href: 'https://mcdu-sim.vercel.app', external: true },
            ];

            const currentItem = navItems.find(i => i.id === currentMode) || navItems[0];

            const handleItemClick = (item) => {
                setDropdownOpen(false);
                if (item.type === 'mode') {
                    if (item.id !== currentMode && onSwitchMode) {
                        onSwitchMode();
                    }
                } else if (item.external) {
                    window.open(item.href, '_blank', 'noopener,noreferrer');
                } else {
                    window.location.href = item.href;
                }
            };

            return (
                <div className="relative">
                    {/* 데스크탑 5단 세그먼트 버튼 (sm 이상) */}
                    <div className="hidden sm:flex bg-slate-800 rounded-lg p-0.5 border border-slate-700">
                        <button
                            type="button"
                            onClick={currentMode === 'wb' ? undefined : onSwitchMode}
                            className={`px-3 py-1.5 rounded-md text-[10px] font-black flex items-center gap-1 transition-all ${
                                currentMode === 'wb' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                            }`}
                        >
                            <span>🚁</span> W&B
                        </button>
                        <button
                            type="button"
                            onClick={currentMode === 'pa' ? undefined : onSwitchMode}
                            className={`px-3 py-1.5 rounded-md text-[10px] font-black flex items-center gap-1 transition-all ${
                                currentMode === 'pa' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                            }`}
                        >
                            <span>📊</span> Engine PA
                        </button>
                        <a
                            href="e6b.html"
                            className="px-3 py-1.5 rounded-md text-[10px] font-black text-slate-400 hover:text-white transition-all flex items-center gap-1"
                        >
                            <span>🧮</span> E6B
                        </a>
                        <a
                            href="motoring.html"
                            className="px-3 py-1.5 rounded-md text-[10px] font-black text-slate-400 hover:text-white transition-all flex items-center gap-1"
                        >
                            <span>⏱️</span> Motoring
                        </a>
                        <a
                            href="https://mcdu-sim.vercel.app"
                            target="_blank"
                            rel="noopener noreferrer"
                            className="px-3 py-1.5 rounded-md text-[10px] font-black text-slate-400 hover:text-white transition-all flex items-center gap-1"
                            title="AW139 MCDU Trainer (FMS Sim)"
                        >
                            <span>🎛️</span> MCDU Sim
                        </a>
                    </div>

                    {/* 모바일 드롭다운 메뉴 (sm 미만) */}
                    <div className="sm:hidden" ref={dropdownRef}>
                        <button
                            type="button"
                            onClick={() => setDropdownOpen(!dropdownOpen)}
                            className="flex items-center gap-1.5 bg-slate-800 text-white border border-slate-700 px-2.5 py-1.5 rounded-lg text-[11px] font-black shadow transition-all active:scale-95"
                        >
                            <span>{currentItem.icon}</span>
                            <span>{currentItem.label}</span>
                            <Icon name="chevron-down" size={12} className={`text-slate-400 transition-transform duration-200 ${dropdownOpen ? 'rotate-180' : ''}`} />
                        </button>

                        {dropdownOpen && (
                            <div className="absolute left-0 top-full mt-1.5 w-44 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl py-1 z-50 animate-in fade-in">
                                {navItems.map(item => {
                                    const isActive = item.id === currentMode;
                                    return (
                                        <button
                                            key={item.id}
                                            type="button"
                                            onClick={() => handleItemClick(item)}
                                            className={`w-full flex items-center justify-between px-3 py-2 text-[11px] font-bold transition-colors ${
                                                isActive
                                                    ? 'bg-blue-600/20 text-blue-400'
                                                    : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                                            }`}
                                        >
                                            <span className="flex items-center gap-2">
                                                <span>{item.icon}</span>
                                                <span>{item.label}</span>
                                            </span>
                                            {item.external && <Icon name="external-link" size={11} className="text-slate-500" />}
                                            {isActive && <span className="w-1.5 h-1.5 rounded-full bg-blue-500"></span>}
                                        </button>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ======================= CG (W&B) 데이터 =======================
        const AIRCRAFT_DEFAULTS = {
            HL9277: {
                name: "HL9277(6,400Kg)",
                bew: 4591.98,
                bewArm: 5.35766,
                maxTow: 6400,
                emsWeight: 110.8,
                emsArm: 4.271
            },
            HL9695: {
                name: "HL9695(7,000Kg)",
                bew: 4881.3,
                bewArm: 5.329,
                maxTow: 7000,
                emsWeight: 54.5,
                emsArm: 4.271
            }
        };

        const WATER_TANK_OPTIONS = [
            { label: "미장착", weight: 0, arm: 0 },
            { label: "EMPTY", weight: 225.9, arm: 4.82 },
            { label: "WATER - FULL", weight: 1813.5, arm: 5.28 },
            { label: "WATER - 3/4 (6° Hover)", weight: 1360.3, arm: 5.422 },
            { label: "WATER - 3/4", weight: 1360.3, arm: 5.267 },
            { label: "WATER - 1/2 (6° Hover)", weight: 906.7, arm: 5.478 },
            { label: "WATER - 1/2", weight: 906.7, arm: 5.226 },
            { label: "WATER - 1/4 (6° Hover)", weight: 453.6, arm: 5.596 },
            { label: "WATER - 1/4", weight: 453.6, arm: 5.157 },
        ];

        const DEFAULT_WB_ITEMS = [
            { id: 'bew', label: 'B.E.W (자중)', weight: 4881.3, arm: 5.329, isFuel: false, isOptional: false, isActive: true, isFixed: true },
            { id: 'pilot', label: 'Pilot/Copilot', weight: 160, arm: 2.82, isFuel: false, isOptional: false, isActive: true },
            { id: 'pax1', label: '1 ROW PAX', weight: 0, arm: 3.415, isFuel: false, isOptional: false, isActive: true },
            { id: 'pax2', label: '2 ROW PAX', weight: 0, arm: 4.789, isFuel: false, isOptional: false, isActive: true },
            { id: 'pax3', label: '3 ROW PAX', weight: 0, arm: 5.6, isFuel: false, isOptional: false, isActive: true },
            { id: 'bag', label: 'Bag Comp', weight: 0, arm: 7.7, isFuel: false, isOptional: false, isActive: true },
            { id: 'ems', label: 'EMS KIT', weight: 54.5, arm: 4.271, isFuel: false, isOptional: true, isActive: true },
            { id: 'fuel', label: 'FUEL', weight: 820, arm: 6.217, isFuel: true, isOptional: false, isActive: true },
            { id: 'hoist', label: 'HOIST', weight: 0, arm: 4.25, isFuel: false, isOptional: false, isActive: true },
            { id: 'cargo', label: 'CARGO', weight: 0, arm: 5.3, isFuel: false, isOptional: true, isActive: true },
            { id: 'watertank', label: 'WATER TANK', weight: 0, arm: 0, isFuel: false, isOptional: true, isActive: false, isDropdown: true, selectedIndex: 0 },
            { id: 'pump', label: 'REFILL PUMP', weight: 44.9, arm: 6.595, isFuel: false, isOptional: true, isActive: false },
        ];

        const ENVELOPE_DATA = {
            HL9277: [
                { id: '1', x: 5.000, y: 4660, coord: "(5.0, 4660)" }, { id: '2', x: 5.000, y: 5170, coord: "(5.0, 5170)" },
                { id: '4', x: 5.180, y: 6400, coord: "(5.18, 6400)" }, { id: '10', x: 5.504, y: 6400, coord: "(5.504, 6400)" },
                { id: '11', x: 5.595, y: 4850, coord: "(5.595, 4850)" }, { id: '12', x: 5.536, y: 4400, coord: "(5.536, 4400)" },
                { id: '13', x: 5.071, y: 4400, coord: "(5.071, 4400)" }, { id: '1', x: 5.000, y: 4660, coord: "" }
            ],
            HL9695: [
                { id: '6', x: 5.266, y: 7000, coord: "(5.266, 7000)" }, { id: '8', x: 5.469, y: 7000, coord: "(5.469, 7000)" },
                { id: '9', x: 5.480, y: 6800, coord: "(5.48, 6800)" }, { id: '10', x: 5.504, y: 6400, coord: "(5.504, 6400)" },
                { id: '11', x: 5.595, y: 4850, coord: "(5.595, 4850)" }, { id: '12', x: 5.536, y: 4400, coord: "(5.536, 4400)" },
                { id: '13', x: 5.071, y: 4400, coord: "(5.071, 4400)" }, { id: '1', x: 5.000, y: 4660, coord: "(5.0, 4660)" },
                { id: '2', x: 5.000, y: 5170, coord: "(5.0, 5170)" }, { id: '4', x: 5.180, y: 6400, coord: "(5.18, 6400)" },
                { id: '5', x: 5.238, y: 6800, coord: "(5.238, 6800)" }, { id: '6', x: 5.266, y: 7000, coord: "" }
            ]
        };

        // ======================= Lateral CG 인벨로프 데이터 =======================
        const LATERAL_ENVELOPE = {
            HL9277: {
                standard: [
                    { x: -0.070, y: 6400, label: '①' }, { x: 0.090, y: 6400, label: '②' },
                    { x: 0.120, y: 4400, label: '③' }, { x: -0.088, y: 4400, label: '④' },
                    { x: -0.070, y: 6400 }
                ],
                hoistOps: [
                    { x: 0.145, y: 6400, label: '⑤' },
                    { x: 0.185, y: 4800, label: '⑥' },
                    { x: 0.120, y: 4400 }
                ]
            },
            HL9695: {
                standard: [
                    { x: -0.064, y: 7000, label: '①' }, { x: 0.081, y: 7000, label: '②' },
                    { x: 0.120, y: 4400, label: '③' }, { x: -0.088, y: 4400, label: '④' },
                    { x: -0.070, y: 6400, label: '⑤' }, { x: -0.066, y: 6800, label: '⑥' },
                    { x: -0.064, y: 7000 }
                ],
                hoistOps: [
                    { x: 0.134, y: 6800, label: '⑧' },
                    { x: 0.145, y: 6400, label: '⑨' }, { x: 0.185, y: 4900, label: '⑩' },
                    { x: 0.120, y: 4400 }
                ]
            }
        };

        // 중량에 따른 Lateral CG 한계치 선형 보간
        const getLateralLimits = (weight, ac) => {
            const d = {
                HL9277: { maxW: 6400, lBot: -0.088, lTop: -0.070, rBot: 0.120, rTop: 0.090 },
                HL9695: { maxW: 7000, lBot: -0.088, lTop: -0.064, rBot: 0.120, rTop: 0.081 }
            }[ac];
            if (!d || weight < 4400 || weight > d.maxW) return null;
            const t = (weight - 4400) / (d.maxW - 4400);
            return { left: d.lBot + t * (d.lTop - d.lBot), right: d.rBot + t * (d.rTop - d.rBot) };
        };

        // ======================= Lateral CG 좌석 배치 데이터 =======================
        // sta: 종방향 암 (AFM 기준, mm→m), bl: 횡방향 암 BL (m)
        const SEAT_CONFIG = {
            A: { sta: 3.415, bl: 0.737, row: 0, col: 0 }, B: { sta: 3.415, bl: 0.254, row: 1, col: 0 },
            C: { sta: 3.415, bl: -0.254, row: 2, col: 0 }, D: { sta: 3.415, bl: -0.737, row: 3, col: 0 },
            E: { sta: 4.789, bl: 0.737, row: 0, col: 1 }, F: { sta: 4.789, bl: 0.254, row: 1, col: 1 },
            G: { sta: 4.789, bl: 0,      row: 2, col: 1 }, H: { sta: 4.789, bl: -0.737, row: 3, col: 1 },
            I: { sta: 5.600, bl: 0.737, row: 0, col: 2 }, L: { sta: 5.600, bl: 0.254, row: 1, col: 2 },
            M: { sta: 5.600, bl: -0.254, row: 2, col: 2 }, N: { sta: 5.600, bl: -0.737, row: 3, col: 2 },
            HOIST: { sta: 4.500, bl: 1.503 },
        };
        const VARIABLE_SEATS = {
            HL9277: ['A', 'B', 'C', 'D', 'G', 'I', 'M'],
            HL9695: ['A', 'G', 'I', 'L', 'N']
        };

        // ======================= 좌석 배치도 (동체 평면도 SVG) =======================
        // 단위: cm. 노즈=왼쪽, Stbd(+BL)=위, Port(−BL)=아래.
        // 동체 외형은 교범 배치도를 따라 그린 개략도(종방향 비율은 참고용).
        // 좌석 세로 위치 = SEAT_CONFIG의 BL(계산에 쓰는 값) 그대로.
        const DIAGRAM_SEATS = {
            HL9277: ['A', 'B', 'C', 'D', 'G', 'I', 'M', 'HOIST'],
            HL9695: ['A', 'B', 'C', 'D', 'G', 'I', 'L', 'M', 'N', 'HOIST'],
        };
        // CG 막대 공통 크기(화면 px): 정상범위 띠 두께, 선 두께, 눈금, 삼각형
        const GAUGE_PX = { band: 6, line: 1.2, tick: 4, triW: 9, triH: 8, font: 9 };
        const FUSE_VB = { x: -215, y: -185, w: 1635, h: 370 };   // 왼쪽 여백 = 기수 앞 세로 BL 막대
        const FUSE_COL_X = [300, 390, 474];   // 1·2·3열 좌석 위치(배치도 기준)
        const FUSE_PILOT_X = 200;
        const FUSE_HOIST_X = 380;
        const FUSE_STRETCHER = { w: 60, h: 186 };   // G = 들것(배치도 Stretcher 크기, cm)
        const seatXY = (id, pilotArms) => {
            if (id === 'PLT') return { x: FUSE_PILOT_X, y: -pilotArms.plt * 100 };
            if (id === 'CPT') return { x: FUSE_PILOT_X, y: -pilotArms.cpt * 100 };
            if (id === 'HOIST') return { x: FUSE_HOIST_X, y: -SEAT_CONFIG.HOIST.bl * 100 };
            const c = SEAT_CONFIG[id];
            return { x: FUSE_COL_X[c.col], y: -c.bl * 100 };
        };
        const toPct = ({ x, y }) => ({
            left: `${((x - FUSE_VB.x) / FUSE_VB.w * 100).toFixed(2)}%`,
            top: `${((y - FUSE_VB.y) / FUSE_VB.h * 100).toFixed(2)}%`,
        });
        const FUSE_OUTLINE = [
            'M0 0',
            'C0 -42 48 -80 110 -98', 'C150 -110 190 -114 230 -114',
            'L470 -114 L484 -152 Q487 -160 495 -160 L587 -160 Q595 -160 597 -152 L607 -114',
            'L784 -39 L1330 -5 L1330 5 L784 39',
            'L607 114 L597 152 Q595 160 587 160 L495 160 Q487 160 484 152 L470 114',
            'L230 114', 'C190 114 150 110 110 98', 'C48 80 0 42 0 0 Z',
        ].join(' ');

        const FuselageDiagram = ({ gauge }) => (
            <svg viewBox={`${FUSE_VB.x} ${FUSE_VB.y} ${FUSE_VB.w} ${FUSE_VB.h}`}
                 className="absolute inset-0 w-full h-full" aria-hidden="true">
                <g fill="none" stroke="#94a3b8" strokeWidth="2" strokeLinejoin="round">
                    {/* 수평 안정판 */}
                    <rect x="1117" y="-145" width="63" height="290" rx="6" fill="#fff" />
                    {/* 동체 */}
                    <path d={FUSE_OUTLINE} fill="#fff" />
                    {/* 조종실 앞유리 · 격벽 */}
                    <path d="M62 -72 C88 -30 88 30 62 72" strokeWidth="1.5" />
                    <line x1="230" y1="-114" x2="230" y2="114" strokeWidth="1.5" />
                    {/* 조종석 */}
                    <rect x="172" y="-80" width="52" height="50" rx="8" strokeWidth="1.5" />
                    <rect x="172" y="30" width="52" height="50" rx="8" strokeWidth="1.5" />
                    {/* 객실 내부 */}
                    <rect x="246" y="-100" width="350" height="200" rx="6" strokeWidth="1.5" stroke="#cbd5e1" />
                    {/* 엔진 · 테일붐 시작 */}
                    <line x1="607" y1="-114" x2="607" y2="114" strokeWidth="1.5" stroke="#cbd5e1" />
                </g>
                {/* 중심선 BL 0 */}
                <line x1="-30" y1="0" x2="1410" y2="0" stroke="#cbd5e1" strokeWidth="1.5" strokeDasharray="10 8" />
                <g fontSize="15" fill="#94a3b8" fontWeight="600">
                    <text x="-30" y="-8">FWD</text>
                </g>
                {gauge && <LateralGaugeV {...gauge} />}
            </svg>
        );
        // Lateral CG 세로 막대: 기수 앞에 세움. 위 = 우(Stbd +), 아래 = 좌(Port −). 범위 -0.12~+0.22 m를 확대해서 표시
        const LateralGaugeV = ({ cg, limits, ok, hoistOps, s = 0.35 }) => {
            const u = v => v / s, G = GAUGE_PX;
            const X = -140, top = -140, v0 = -0.12, v1 = 0.22;
            const k = -top / v1, bot = -v0 * k;   // BL 0 = 기수 중심선(y=0)에 맞춤
            const ys = v => -Math.max(v0, Math.min(v1, v)) * k;
            const ticks = [-0.10, -0.05, 0, 0.05, 0.10, 0.15, 0.20];
            const out = cg < v0 || cg > v1, triR = X - u(G.band / 2 + 1);
            return (
                <g>
                    <line x1={X} y1={top} x2={X} y2={bot} stroke="#cbd5e1" strokeWidth={u(G.line)} />
                    {limits && <rect x={X - u(G.band / 2)} y={ys(limits.right)} width={u(G.band)} height={ys(limits.left) - ys(limits.right)} rx={u(2)} fill="#bbf7d0" stroke="#4ade80" strokeWidth={u(1)} />}
                    {ticks.map(t => (
                        <g key={t}>
                            <line x1={X - u(G.tick)} y1={ys(t)} x2={X + u(G.tick)} y2={ys(t)} stroke={t === 0 ? '#64748b' : '#94a3b8'} strokeWidth={u(1)} />
                            <text x={X + u(G.tick + 4)} y={ys(t)} dominantBaseline="middle" fontSize={u(G.font)} fill="#94a3b8">{t === 0 ? '0' : (t > 0 ? '+' : '') + t.toFixed(2)}</text>
                        </g>
                    ))}
                    <text x={X} y={top - u(4)} textAnchor="middle" fontSize={u(G.font)} fill="#64748b" fontWeight="600">BL{hoistOps ? ' (호이스트)' : ''}</text>
                    <path d={`M${triR} ${ys(cg)} l${-u(G.triH)} ${-u(G.triW / 2)} v${u(G.triW)} Z`} fill={ok ? '#059669' : '#dc2626'} />
                    {out && <text x={triR - u(G.triH + 3)} y={ys(cg)} textAnchor="end" dominantBaseline="middle" fontSize={u(G.font)} fill="#dc2626">범위 밖</text>}
                </g>
            );
        };


        // ======================= 공통 인벨로프 차트 (Long · Lateral 같은 모양) =======================
        const CHART_C = {
            grid: '#eef2f6', axis: '#94a3b8', tick: '#64748b', env: '#475569', envFill: '#f8fafc',
            ref: '#94a3b8', hoist: '#d97706', ok: '#059669', bad: '#dc2626', path: '#64748b',
        };
        const niceRange = (lo, hi, vals, step) => {
            const vmin = Math.min(lo, ...vals), vmax = Math.max(hi, ...vals);
            return [vmin < lo ? Math.floor(vmin / step) * step : lo, vmax > hi ? Math.ceil(vmax / step) * step : hi];
        };
        const ticksOf = (lo, hi, step) => {
            const out = [];
            for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
            return out;
        };
        // polygons: [{ pts:[{x,y}], kind:'env'|'hoist', closed }]   lines: [{x1,y1,x2,y2,kind:'ref'|'hoist'|'zero'}]
        // marks: [{ x, y, kind:'actual'|'zero', ok, title }]
        const EnvelopeChart = ({ xDomain, xStep, yDomain = [4200, 7200], yStep = 500, xLabel, yLabel = 'Weight (kg)',
                                 xFmt = v => v.toFixed(1), coordFmt = p => `(${p.x.toFixed(3)}, ${p.y.toLocaleString()})`, polygons = [], lines = [], marks = [], showCoords, alert = false, fit = false }) => {
            // fit: 감싼 칸 크기(px)를 재서 그대로 그림 → 칸이 커져도 글자 크기 유지
            const boxRef = useRef(null);
            const [dim, setDim] = useState({ w: 420, h: 380 });
            useEffect(() => {
                const el = boxRef.current;
                if (!fit || !el || typeof ResizeObserver === 'undefined') return;
                const ro = new ResizeObserver(() => { if (el.clientWidth && el.clientHeight) setDim({ w: el.clientWidth, h: el.clientHeight }); });
                ro.observe(el);
                return () => ro.disconnect();
            }, [fit]);
            const envStroke = alert ? CHART_C.bad : CHART_C.env, envFill = alert ? '#fef2f2' : CHART_C.envFill;
            const W = fit ? dim.w : 420, H = fit ? dim.h : 380, M = { t: 18, r: 20, b: 50, l: 58 };
            const CW = W - M.l - M.r, CH = H - M.t - M.b;
            const mx = marks.filter(m => isFinite(m.x) && isFinite(m.y));
            const [x0, x1] = niceRange(xDomain[0], xDomain[1], mx.map(m => m.x), xStep);
            const [y0, y1] = niceRange(yDomain[0], yDomain[1], mx.map(m => m.y), yStep);
            const xs = v => M.l + (v - x0) / (x1 - x0) * CW;
            const ys = v => M.t + (1 - (v - y0) / (y1 - y0)) * CH;
            const d = (pts, closed) => pts.map((p, i) => `${i ? 'L' : 'M'}${xs(p.x).toFixed(1)} ${ys(p.y).toFixed(1)}`).join(' ') + (closed ? 'Z' : '');
            const lineStyle = k => k === 'hoist' ? { stroke: CHART_C.hoist, strokeDasharray: '5 4' }
                                 : k === 'zero' ? { stroke: CHART_C.ref, strokeDasharray: '3 3' }
                                 : { stroke: CHART_C.ref, strokeDasharray: '5 4' };
            const labelled = [];
            polygons.forEach(pg => pg.pts.forEach((p, i) => {
                const dupOfFirst = i === pg.pts.length - 1 && p.x === pg.pts[0].x && p.y === pg.pts[0].y;
                if (!dupOfFirst && !p.noLabel) labelled.push(p);
            }));
            const svg = (
                <svg viewBox={`0 0 ${W} ${H}`} className={fit ? "w-full h-full block" : "w-full h-auto block"} role="img" aria-label="CG envelope">
                    <rect x={M.l} y={M.t} width={CW} height={CH} fill={alert ? '#fffafa' : '#fff'} stroke={alert ? '#fca5a5' : CHART_C.grid} />
                    {ticksOf(y0, y1, yStep).map(v => (
                        <g key={`y${v}`}>
                            <line x1={M.l} x2={M.l + CW} y1={ys(v)} y2={ys(v)} stroke={CHART_C.grid} />
                            <text x={M.l - 6} y={ys(v)} textAnchor="end" dominantBaseline="middle" fontSize="11" fill={CHART_C.tick}>{v.toLocaleString()}</text>
                        </g>
                    ))}
                    {ticksOf(x0, x1, xStep).map(v => (
                        <g key={`x${v}`}>
                            <line x1={xs(v)} x2={xs(v)} y1={M.t} y2={M.t + CH} stroke={CHART_C.grid} />
                            <text x={xs(v)} y={M.t + CH + 16} textAnchor="middle" fontSize="11" fill={CHART_C.tick}>{xFmt(v)}</text>
                        </g>
                    ))}
                    <line x1={M.l} y1={M.t} x2={M.l} y2={M.t + CH} stroke={CHART_C.axis} />
                    <line x1={M.l} y1={M.t + CH} x2={M.l + CW} y2={M.t + CH} stroke={CHART_C.axis} />
                    {lines.map((l, i) => (
                        <line key={`l${i}`} x1={xs(l.x1)} y1={ys(l.y1)} x2={xs(l.x2)} y2={ys(l.y2)} strokeWidth="1.2" {...lineStyle(l.kind)} />
                    ))}
                    {polygons.map((pg, i) => pg.kind === 'env'
                        ? <path key={`p${i}`} d={d(pg.pts, pg.closed)} fill={envFill} fillOpacity="0.6" stroke={envStroke} strokeWidth="1.6" strokeLinejoin="round" />
                        : <path key={`p${i}`} d={d(pg.pts, pg.closed)} fill="none" strokeWidth="1.6" strokeLinejoin="round" {...lineStyle(pg.kind)} />
                    )}
                    {labelled.map((p, i) => <circle key={`v${i}`} cx={xs(p.x)} cy={ys(p.y)} r="2.5" fill="#fff" stroke={envStroke} strokeWidth="1.2" />)}
                    {showCoords && labelled.map((p, i) => {
                        const cx = xs(p.x), cy = ys(p.y);
                        const anchor = cx < M.l + CW * 0.2 ? 'start' : cx > M.l + CW * 0.8 ? 'end' : 'middle';
                        return <text key={`t${i}`} x={cx} y={cy + (cy < M.t + CH / 2 ? -8 : 15)} textAnchor={anchor} fontSize="9" fill={CHART_C.tick}>{coordFmt(p)}</text>;
                    })}
                    {mx.map((m, i) => m.kind === 'zero'
                        ? <circle key={`m${i}`} cx={xs(m.x)} cy={ys(m.y)} r="4" fill="#fff" stroke={m.ok === false ? CHART_C.bad : CHART_C.path} strokeWidth="1.6"><title>{m.title}</title></circle>
                        : <circle key={`m${i}`} cx={xs(m.x)} cy={ys(m.y)} r="5" fill={m.ok ? CHART_C.ok : CHART_C.bad} stroke="#fff" strokeWidth="1.5"><title>{m.title}</title></circle>
                    )}
                    <text x={M.l + CW / 2} y={H - 8} textAnchor="middle" fontSize="11" fill={CHART_C.tick}>{xLabel}</text>
                    <text x="14" y={M.t + CH / 2} textAnchor="middle" fontSize="11" fill={CHART_C.tick} transform={`rotate(-90,14,${M.t + CH / 2})`}>{yLabel}</text>
                </svg>);
            return fit ? <div ref={boxRef} className="absolute inset-0">{svg}</div> : svg;
        };
        const LegendDot = ({ kind, label }) => (
            <span className="flex items-center gap-1.5 text-[9px] font-bold text-slate-500">
                {kind === 'actual' && <span className="w-2.5 h-2.5 rounded-full" style={{ background: CHART_C.ok }} />}
                {kind === 'zero' && <span className="w-2.5 h-2.5 rounded-full bg-white" style={{ border: `1.5px solid ${CHART_C.path}` }} />}
                {kind === 'hoist' && <span className="w-4 h-0" style={{ borderTop: `2px dashed ${CHART_C.hoist}` }} />}
                {label}
            </span>
        );
        const CoordToggle = ({ on, onToggle }) => (
            <button onClick={onToggle} title="좌표값 표시 ON/OFF"
                className={`no-print px-2 py-0.5 rounded text-[9px] font-bold border transition-colors ${on ? 'bg-slate-800 border-slate-800 text-white' : 'bg-white border-slate-300 text-slate-500'}`}>
                좌표
            </button>
        );

        // ======================= RFM 연료·수하물 암 =======================
        // AW139 RFM 4D (ISSUE 2, Rev.31) Section 6 Page 6-9 "TOTAL FUEL" 표: [무게 kg, 암 mm]. 사이 값은 모멘트를 선형 보간.
        const RFM_FUEL_ARM = [[25,6208], [50,6209], [75,6210], [100,6210], [125,6210], [150,6210], [175,6210], [200,6210], [225,6210], [250,6210], [275,6210], [300,6210], [325,6210], [350,6211], [375,6211], [400,6211], [425,6211], [450,6211], [475,6211], [500,6212], [525,6212], [550,6212], [575,6212], [600,6213], [625,6213], [650,6214], [675,6214], [700,6214], [725,6215], [750,6215], [775,6216], [800,6217], [825,6219], [850,6221], [875,6223], [900,6225], [925,6225], [950,6226], [975,6227], [1000,6228], [1025,6228], [1050,6229], [1075,6229], [1100,6230], [1125,6230], [1150,6231], [1175,6231], [1200,6232], [1225,6232], [1250,6233], [1270,6233]];
        const RFM_FUEL_MAX = 1270;
        const rfmFuelArm = (w) => {
            const T = RFM_FUEL_ARM;
            if (!(w > 0)) return T[0][1] / 1000;
            if (w <= T[0][0]) return T[0][1] / 1000;
            if (w >= T[T.length - 1][0]) return T[T.length - 1][1] / 1000;
            for (let i = 0; i < T.length - 1; i++) {
                const [w1, a1] = T[i], [w2, a2] = T[i + 1];
                if (w >= w1 && w <= w2) {
                    const m = w1 * a1 + (w - w1) / (w2 - w1) * (w2 * a2 - w1 * a1);   // kg·mm
                    return m / w / 1000;
                }
            }
            return T[T.length - 1][1] / 1000;
        };
        // 같은 RFM Page 6-8 BAGGAGE 표의 세 암(mm 7200·7700·8200). Section 1: 화물칸 최대 200 kg.
        const RFM_BAG_ARMS = [{ arm: 7.2, label: '앞' }, { arm: 7.7, label: '가운데' }, { arm: 8.2, label: '뒤' }];
        const RFM_BAG_MAX = 200;

        // ======================= 인벨로프 판정 · 조정 제안 =======================
        // 점이 다각형 안(경계 포함)인지. 경계 허용 오차: 0.01mm / 0.01kg
        const pointInPolygon = (x, y, poly) => {
            const pts = poly.map(p => [p.x * 1000, p.y]); // m → mm 로 맞춰 거리 계산
            const X = x * 1000, Y = y;
            for (let i = 0; i < pts.length - 1; i++) {
                const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
                const dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy;
                const t = L ? Math.max(0, Math.min(1, ((X - x1) * dx + (Y - y1) * dy) / L)) : 0;
                if (Math.hypot(X - (x1 + t * dx), Y - (y1 + t * dy)) <= 0.01) return true;
            }
            let inside = false;
            for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
                const [xi, yi] = pts[i], [xj, yj] = pts[j];
                if ((yi > Y) !== (yj > Y) && X < (xj - xi) * (Y - yi) / (yj - yi) + xi) inside = !inside;
            }
            return inside;
        };
        const inLongEnvelope = (cg, w, ac) => w > 0 && isFinite(cg) && pointInPolygon(cg, w, ENVELOPE_DATA[ac]);
        const sumWM = (arr) => {
            const W = arr.reduce((s, i) => s + i.weight, 0), M = arr.reduce((s, i) => s + i.weight * i.arm, 0);
            return { W, cg: W > 0 ? M / W : 0 };
        };
        // 이륙 상태와 연료 소진(Zero Fuel) 상태가 모두 한계 안인지
        const longCheck = (active, ac) => {
            const to = sumWM(active), zf = sumWM(active.filter(i => !i.isFuel));
            const maxTow = AIRCRAFT_DEFAULTS[ac].maxTow;
            const weightOk = to.W <= maxTow;
            const toOk = weightOk && inLongEnvelope(to.cg, to.W, ac);
            const zfOk = inLongEnvelope(zf.cg, zf.W, ac);
            const bag = active.find(i => i.id === 'bag'), fuel = active.find(i => i.isFuel);
            const bagOk = !bag || bag.weight <= RFM_BAG_MAX;
            const fuelOk = !fuel || fuel.weight <= RFM_FUEL_MAX;
            return { to, zf, maxTow, weightOk, toOk, zfOk, bagOk, fuelOk, ok: toOk && zfOk && bagOk && fuelOk };
        };
        // 한 항목(연료 또는 카고)만 바꿔서 한계 안으로 들어오는 값 찾기 (1kg 단위)
        const ADJUSTABLE = [{ id: 'fuel', name: '연료' }, { id: 'cargo', name: '카고' }, { id: 'bag', name: '수하물' }];
        const suggestAdjustments = (active, ac) => {
            const base = longCheck(active, ac);
            const withW = (id, w) => active.map(i => i.id === id ? { ...i, weight: w, ...(i.isFuel ? { arm: rfmFuelArm(w) } : {}) } : i);
            const out = { check: base, reduce: [], maxCargo: null };
            if (!base.ok) {
                ADJUSTABLE.forEach(({ id, name }) => {
                    const it = active.find(i => i.id === id);
                    if (!it || it.weight <= 0) return;
                    for (let w = Math.floor(it.weight); w >= 0; w--) {
                        if (w === it.weight) continue;
                        if (longCheck(withW(id, w), ac).ok) { out.reduce.push({ id, name, from: it.weight, to: w }); break; }
                    }
                });
            } else {
                const cargo = active.find(i => i.id === 'cargo');
                if (cargo && cargo.weight > 0) {
                    let w = cargo.weight;
                    while (w < cargo.weight + 3000 && longCheck(withW('cargo', Math.floor(w) + 1), ac).ok) w = Math.floor(w) + 1;
                    out.maxCargo = { from: cargo.weight, max: Math.floor(w) };
                }
            }
            return out;
        };

        // ======================= 버튼 근처에 뜨는 입력 창 =======================
        // containerRef: position:relative 인 상자. anchor: 누른 요소. body zoom 보정 포함.
        const AnchoredPopover = ({ containerRef, anchor, width = 204, estH = 140, onClose, children }) => {
            const box = containerRef.current;
            let left = 8, top = 40, above = false, arrowX = width / 2;
            if (box && anchor && anchor.isConnected) {
                const br = box.getBoundingClientRect(), ar = anchor.getBoundingClientRect();
                const k = br.width ? box.offsetWidth / br.width : 1;
                const cx = (ar.left + ar.width / 2 - br.left) * k;
                // 잘리는 경계 = 화면 아래 또는 overflow로 자르는 가장 가까운 상위 칸
                let clip = box.parentElement, limitBottom = window.innerHeight, limitTop = 0;
                while (clip && clip !== document.body) {
                    const ov = getComputedStyle(clip).overflowY;
                    if (ov === 'hidden' || ov === 'auto' || ov === 'scroll' || ov === 'clip') {
                        const cr = clip.getBoundingClientRect();
                        limitBottom = Math.min(limitBottom, cr.bottom); limitTop = Math.max(limitTop, cr.top);
                        break;
                    }
                    clip = clip.parentElement;
                }
                const fitsBelow = ar.bottom + (estH + 12) / k <= limitBottom;
                const fitsAbove = ar.top - (estH + 12) / k >= limitTop;
                above = !fitsBelow && fitsAbove;
                top = above ? (ar.top - br.top) * k - 8 : (ar.bottom - br.top) * k + 8;
                left = Math.max(4, Math.min(box.offsetWidth - width - 4, cx - width / 2));
                arrowX = Math.max(12, Math.min(width - 12, cx - left));
            }
            useEffect(() => {
                const onKey = e => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [onClose]);
            return (
                <>
                    <div className="fixed inset-0 z-20" onClick={onClose} />
                    <div className="absolute z-30 bg-white rounded-lg border border-slate-200 shadow-xl p-3"
                         style={{ left, top, width, transform: above ? 'translateY(-100%)' : 'none' }}
                         onClick={e => e.stopPropagation()}>
                        <span className="absolute w-2.5 h-2.5 bg-white border-slate-200 rotate-45"
                              style={{ left: arrowX - 5, ...(above ? { bottom: -6, borderRightWidth: 1, borderBottomWidth: 1 } : { top: -6, borderLeftWidth: 1, borderTopWidth: 1 }) }} />
                        {children}
                    </div>
                </>
            );
        };
        // 입력 창 공통 부품 (Long·Lateral 같은 모양)
        const PopHeader = ({ title, sub }) => (
            <div className="flex items-baseline justify-between gap-2 pb-2 mb-2 border-b border-slate-100">
                <span className="text-[12px] font-bold text-slate-800 truncate">{title}</span>
                {sub && <span className="text-[10px] text-slate-400 font-mono shrink-0">{sub}</span>}
            </div>
        );
        const PopLabel = ({ children }) => <div className="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-1">{children}</div>;
        const PopField = ({ label, unit, children }) => (
            <div className="mb-2">
                {label && <PopLabel>{label}</PopLabel>}
                <div className="flex items-center border border-slate-300 rounded-md px-2.5 py-1.5 bg-white focus-within:border-slate-600 focus-within:ring-2 focus-within:ring-slate-100">
                    {children}
                    {unit && <span className="text-[10px] text-slate-400 ml-1.5 shrink-0">{unit}</span>}
                </div>
            </div>
        );
        const PopSwitch = ({ label, checked, onChange }) => (
            <button type="button" onClick={() => onChange(!checked)} className="w-full flex items-center justify-between mb-2 py-0.5">
                <span className="text-[11px] font-bold text-slate-600">{label}</span>
                <span className={`relative w-8 h-[18px] rounded-full transition-colors ${checked ? 'bg-slate-800' : 'bg-slate-300'}`}>
                    <span className={`absolute top-[2px] w-[14px] h-[14px] rounded-full bg-white shadow transition-all ${checked ? 'left-[16px]' : 'left-[2px]'}`} />
                </span>
            </button>
        );
        const PopSegment = ({ label, options, value, onChange }) => (
            <div className="mb-2">
                {label && <PopLabel>{label}</PopLabel>}
                <div className="flex rounded-md border border-slate-300 overflow-hidden text-[10px] font-bold">
                    {options.map(o => (
                        <button key={o.value} type="button" onClick={() => onChange(o.value)}
                            className={`flex-1 py-1 ${o.value === value ? 'bg-slate-800 text-white' : 'bg-white text-slate-500 hover:text-slate-800'}`}>{o.text}</button>
                    ))}
                </div>
            </div>
        );
        const POP_INPUT = "flex-1 min-w-0 text-[15px] font-bold text-right outline-none bg-transparent font-mono text-slate-800";
        const PopButtons = ({ onClear, clearLabel = '비우기', onCancel, onOk }) => (
            <div className="flex gap-1.5 mt-3">
                {onClear && <button onClick={onClear} className="px-2.5 py-1.5 bg-white border border-slate-300 text-slate-600 rounded-md text-[10px] font-bold hover:border-slate-500">{clearLabel}</button>}
                <button onClick={onCancel} className="px-2.5 py-1.5 bg-white border border-slate-300 text-slate-600 rounded-md text-[10px] font-bold hover:border-slate-500">취소</button>
                <button onClick={onOk} className="flex-1 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-md text-[10px] font-bold">확인</button>
            </div>
        );

        // ======================= 호이스트 운용 Lateral 인벨로프 =======================
        // 호이스트 사용 시 오른쪽 한계를 점선(hoistOps)까지 확장. 6,800kg 초과 구간(HL9695)은 기본 한계 그대로.
        const LATERAL_HOIST_ENVELOPE = {
            HL9277: [
                { x: -0.070, y: 6400 }, { x: 0.145, y: 6400 }, { x: 0.185, y: 4800 }, { x: 0.120, y: 4400 },
                { x: -0.088, y: 4400 }, { x: -0.070, y: 6400 },
            ],
            HL9695: [
                { x: -0.064, y: 7000 }, { x: 0.081, y: 7000 }, { x: 0.081 + 0.039 * 200 / 2600, y: 6800 },
                { x: 0.134, y: 6800 }, { x: 0.145, y: 6400 }, { x: 0.185, y: 4900 }, { x: 0.120, y: 4400 },
                { x: -0.088, y: 4400 }, { x: -0.070, y: 6400 }, { x: -0.066, y: 6800 }, { x: -0.064, y: 7000 },
            ],
        };
        // 주어진 무게에서 다각형의 좌·우 한계
        const polyLimitsAt = (poly, w) => {
            const xs = [];
            for (let i = 0; i < poly.length - 1; i++) {
                const a = poly[i], b = poly[i + 1];
                if (a.y === b.y) { if (a.y === w) xs.push(a.x, b.x); continue; }
                if (w >= Math.min(a.y, b.y) && w <= Math.max(a.y, b.y)) xs.push(a.x + (w - a.y) * (b.x - a.x) / (b.y - a.y));
            }
            return xs.length ? { left: Math.min(...xs), right: Math.max(...xs) } : null;
        };

                if (!items.length) return 0;

                const rows = [[]];

                    let x = Math.max(SIDE_ROW_L, Math.min(SIDE_ROW_R - span, mean - span / 2));

        const LateralGauge = ({ cg, limits, ok, hoistOps }) => {
            const W = 640, H = 44, L = 20, R = 20, x0 = -0.12, x1 = 0.22;
            const xs = v => L + (Math.max(x0, Math.min(x1, v)) - x0) / (x1 - x0) * (W - L - R);
            const ticks = [-0.10, -0.05, 0, 0.05, 0.10, 0.15, 0.20], Y = 22;
            const cx = xs(cg), outLeft = cg < x0, outRight = cg > x1;
            return (
                <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto block" aria-label="Lateral CG 허용 범위">
                    <line x1={L} y1={Y} x2={W - R} y2={Y} stroke="#cbd5e1" strokeWidth="1.2" />
                    {limits && <rect x={xs(limits.left)} y={Y - 5} width={xs(limits.right) - xs(limits.left)} height="10" rx="3" fill="#bbf7d0" stroke="#4ade80" strokeWidth="1" />}
                    {ticks.map(t => (
                        <g key={t}>
                            <line x1={xs(t)} y1={Y - 4} x2={xs(t)} y2={Y + 4} stroke={t === 0 ? '#64748b' : '#94a3b8'} strokeWidth="1" />
                            <text x={xs(t)} y={Y + 16} textAnchor="middle" fontSize="9" fill="#94a3b8">{t === 0 ? '0' : t.toFixed(2)}</text>
                        </g>
                    ))}
                    <text x={L} y="9" fontSize="8.5" fill="#94a3b8">← 좌(Port)</text>
                    <text x={W - R} y="9" textAnchor="end" fontSize="8.5" fill="#94a3b8">우(Stbd) →</text>
                    <text x={W / 2} y="9" textAnchor="middle" fontSize="8.5" fill="#64748b">BL (m){hoistOps ? ' · 호이스트 운용 한계' : ''}</text>
                    <path d={`M${cx} ${Y - 3} l-6 -10 h12 Z`} fill={ok ? '#059669' : '#dc2626'} />
                    {(outLeft || outRight) && <text x={cx + (outLeft ? 8 : -8)} y={Y - 6} textAnchor={outLeft ? 'start' : 'end'} fontSize="8.5" fill="#dc2626">범위 밖</text>}
                </svg>
            );
        };

        // ======================= CG (W&B) APP =======================
        const CGApp = ({ onSwitchMode }) => {
            const [selectedAc, setSelectedAc] = useState(() => {
                try {
                    const saved = localStorage.getItem('aw139_selected_ac');
                    if (Object.hasOwn(AIRCRAFT_DEFAULTS, saved)) return saved;
                } catch {}
                return 'HL9695';
            });
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [showCoords, setShowCoords] = useState(true);
            const [currentDate] = useState(new Date().toLocaleDateString('ko-KR'));
            const [showLateral, setShowLateral] = useState(true);
            const [showLateralCoords, setShowLateralCoords] = useState(true);
            const [showPrintDialog, setShowPrintDialog] = useState(false);
            const [printState, setPrintState] = useState(null); // null | 'lateral' | 'no-lateral'
            const handlePrint = () => setShowPrintDialog(true);
            const doPrint = (includeLateral) => {
                setShowPrintDialog(false);
                setPrintState(includeLateral ? 'lateral' : 'no-lateral');
                setTimeout(() => { window.print(); setPrintState(null); }, 200);
            };
            const [customLateralItems, setCustomLateralItems] = useState([]);
            const addCustomLateralItem = () => setCustomLateralItems(prev => [...prev, { id: `clat-${Date.now()}`, label: '', weight: 0, arm: 0 }]);
            const updateCustomLateralItem = (id, field, val) => setCustomLateralItems(prev => prev.map(i => i.id === id ? { ...i, [field]: val } : i));
            const deleteCustomLateralItem = (id) => setCustomLateralItems(prev => prev.filter(i => i.id !== id));
            const [pilotArms, setPilotArms] = useState({ plt: 0.550, cpt: -0.550 });
            const [lateralPilotWeights, setLateralPilotWeights] = useState({ plt: 0, cpt: 0 });
            const [lateralEditPopup, setLateralEditPopup] = useState(null);
            const lepUpdate = (f, v) => setLateralEditPopup(p => p ? {...p, [f]: v} : null);
            const [blSpacingScale, setBlSpacingScale] = useState(100);
            const [seatPopup, setSeatPopup] = useState(null); // { id } — id='_pilot' for crew
            const [seatWeights, setSeatWeights] = useState(() => {
                try { const s = localStorage.getItem('aw139_seat_weights'); if (s) return JSON.parse(s); } catch {}
                return {};
            });
            const [visibleSeats, setVisibleSeats] = useState(() => {
                const defaults = {
                    HL9277: [...VARIABLE_SEATS.HL9277, 'HOIST'],
                    HL9695: [...VARIABLE_SEATS.HL9695, 'HOIST'],
                };
                try {
                    const s = localStorage.getItem('aw139_visible_seats');
                    if (s) {
                        const saved = JSON.parse(s);
                        // HOIST가 없으면 자동 추가
                        return {
                            HL9277: saved.HL9277 ? (saved.HL9277.includes('HOIST') ? saved.HL9277 : [...saved.HL9277, 'HOIST']) : defaults.HL9277,
                            HL9695: saved.HL9695 ? (saved.HL9695.includes('HOIST') ? saved.HL9695 : [...saved.HL9695, 'HOIST']) : defaults.HL9695,
                        };
                    }
                } catch {}
                return defaults;
            });
            const toggleVisibleSeat = (ac, sid) => setVisibleSeats(prev => {
                const cur = prev[ac] || [];
                return { ...prev, [ac]: cur.includes(sid) ? cur.filter(s => s !== sid) : [...cur, sid] };
            });

            const [seatEditMode, setSeatEditMode] = useState(false);
            const seatBoxRef = useRef(null);
            const fuseRef = useRef(null);
            const [fuseW, setFuseW] = useState(560);
            useEffect(() => {
                const el = fuseRef.current;
                if (!el || typeof ResizeObserver === 'undefined') return;
                const ro = new ResizeObserver(() => { if (el.offsetWidth) setFuseW(el.offsetWidth); });
                ro.observe(el);
                return () => ro.disconnect();
            });
            const lateralLeftRef = useRef(null);
            const longBoxRef = useRef(null);
            const longLeftRef = useRef(null);
            const [longPopup, setLongPopup] = useState(null);
            const sideRef = useRef(null);
            const [sideW, setSideW] = useState(560);
            useEffect(() => {
                const el = sideRef.current;
                if (!el || typeof ResizeObserver === 'undefined') return;
                const ro = new ResizeObserver(() => { if (el.offsetWidth) setSideW(el.offsetWidth); });
                ro.observe(el);
                return () => ro.disconnect();
            });
            const [inputMode, setInputMode] = useState(() => {
                try { return localStorage.getItem('aw139_input_mode') === 'cards' ? 'cards' : 'diagram'; } catch { return 'diagram'; }
            });
            useEffect(() => { try { localStorage.setItem('aw139_input_mode', inputMode); } catch {} }, [inputMode]);

            const defaultItemsForAircraft = (ac) => {
                const def = AIRCRAFT_DEFAULTS[ac];
                return DEFAULT_WB_ITEMS.map(item => {
                    if (item.id === 'bew') return { ...item, weight: def.bew, arm: def.bewArm };
                    if (item.id === 'ems') return { ...item, weight: def.emsWeight, arm: def.emsArm };
                    return { ...item };
                });
            };
            const [itemsByAircraft, setItemsByAircraft] = useState(() => {
                const defaults = Object.fromEntries(Object.keys(AIRCRAFT_DEFAULTS).map(ac => [ac, defaultItemsForAircraft(ac)]));
                try {
                    const saved = JSON.parse(localStorage.getItem('aw139_wb_items_by_aircraft'));
                    if (saved && typeof saved === 'object') {
                        for (const ac of Object.keys(defaults)) {
                            if (Array.isArray(saved[ac]) && saved[ac].length > 0) defaults[ac] = saved[ac].map(i => i.id === 'cargo' ? { ...i, isOptional: true } : i);   // 카고도 장착/미장착 항목
                        }
                        return defaults;
                    }
                    // The old shared save had no aircraft ID; migrate it to the selected aircraft only.
                    const legacy = JSON.parse(localStorage.getItem('aw139_wb_items'));
                    if (Array.isArray(legacy) && legacy.length > 0) defaults[selectedAc] = legacy.map(i => i.id === 'cargo' ? { ...i, isOptional: true } : i);
                } catch {}
                return defaults;
            });
            const items = itemsByAircraft[selectedAc];
            const setItems = (update) => setItemsByAircraft(prev => ({
                ...prev,
                [selectedAc]: typeof update === 'function' ? update(prev[selectedAc]) : update,
            }));

            useEffect(() => {
                try {
                    localStorage.setItem('aw139_wb_items_by_aircraft', JSON.stringify(itemsByAircraft));
                    localStorage.setItem('aw139_selected_ac', selectedAc);
                } catch (error) {
                    console.error('W&B 자동 저장 실패', error);
                }
            }, [itemsByAircraft, selectedAc]);

            const saveItemsToLocal = () => {
                try {
                    localStorage.setItem('aw139_wb_items_by_aircraft', JSON.stringify(itemsByAircraft));
                    localStorage.setItem('aw139_selected_ac', selectedAc);
                    alert('현재 W&B 값이 이 브라우저에 저장되었습니다.\n입력값은 변경할 때마다 자동 저장됩니다.');
                } catch {
                    alert('브라우저에 값을 저장할 수 없습니다. 브라우저의 저장 공간 설정을 확인해주세요.');
                }
            };

            const resetWbToDefaults = () => {
                if (!confirm('현재 기체의 저장된 값을 기본값으로 되돌립니다.\n계속하시겠습니까?')) return;
                setItems(defaultItemsForAircraft(selectedAc));
            };

            const stats = useMemo(() => {
                const activeItems = items.filter(i => i.isActive).map(item => {
                    if (item.isDropdown) {
                        const opt = WATER_TANK_OPTIONS[item.selectedIndex];
                        return { ...item, weight: opt.weight, arm: opt.arm, label: `WATER TANK (${opt.label})` };
                    }
                    if (item.isFuel) return { ...item, arm: rfmFuelArm(item.weight) };   // RFM 연료량별 암
                    return item;
                });
                const totalWeight = activeItems.reduce((sum, i) => sum + i.weight, 0);
                const totalMoment = activeItems.reduce((sum, i) => sum + (i.weight * i.arm), 0);
                const cgString = totalWeight > 0 ? (totalMoment / totalWeight).toFixed(4) : "0";
                const zeroFuelWeight = activeItems.filter(i => !i.isFuel).reduce((sum, i) => sum + i.weight, 0);
                const zeroFuelMoment = activeItems.filter(i => !i.isFuel).reduce((sum, i) => sum + (i.weight * i.arm), 0);
                const zeroFuelCG = zeroFuelWeight > 0 ? (zeroFuelMoment / zeroFuelWeight).toFixed(4) : "0";
                const isWeightSafe = totalWeight <= AIRCRAFT_DEFAULTS[selectedAc].maxTow;
                // 인벨로프 다각형 판정 (이전: CG 4.9~5.7m 범위만 확인)
                const lc = longCheck(activeItems, selectedAc);
                const cgSafe = lc.toOk;          // 이륙: 최대중량 이하 + 인벨로프 안
                const zeroFuelSafe = lc.zfOk;    // 연료 소진 시: 인벨로프 안
                return { totalWeight, cg: cgString, zeroFuelWeight, zeroFuelCG, isWeightSafe, cgSafe, zeroFuelSafe, longOk: lc.ok, tableData: activeItems, totalMoment };
            }, [items, selectedAc]);
            const advice = useMemo(() => suggestAdjustments(stats.tableData, selectedAc), [stats, selectedAc]);
            // 현재 이륙 중량에서 허용되는 CG 앞·뒤 한계(인벨로프 가로 자름)
            const longBand = useMemo(() => stats.totalWeight <= AIRCRAFT_DEFAULTS[selectedAc].maxTow ? polyLimitsAt(ENVELOPE_DATA[selectedAc], stats.totalWeight) : null, [stats, selectedAc]);

            useEffect(() => {
                localStorage.setItem('aw139_seat_weights', JSON.stringify(seatWeights));
            }, [seatWeights]);

            useEffect(() => {
                localStorage.setItem('aw139_visible_seats', JSON.stringify(visibleSeats));
            }, [visibleSeats]);

            const lateralStats = useMemo(() => {
                // 장비/구조물: pilot 제외, items의 lateralArm 사용
                const itemMoment = stats.tableData.filter(i => i.id !== 'pilot').reduce((sum, i) => sum + i.weight * (i.lateralArm || 0), 0);
                // 조종사: lateral 전용 개별 무게 사용 (long CG와 독립)
                const pilotMoment = lateralPilotWeights.plt * pilotArms.plt + lateralPilotWeights.cpt * pilotArms.cpt;
                // 탑승자: 좌석 다이어그램 입력값 사용
                const varSeats = visibleSeats[selectedAc] || [];
                const seatMoment = varSeats.reduce((sum, id) => sum + (seatWeights[id] || 0) * (SEAT_CONFIG[id]?.bl || 0), 0);
                // 임의 추가 항목
                const customMoment = customLateralItems.reduce((sum, i) => sum + (i.weight || 0) * (i.arm || 0), 0);
                const totalLateralMoment = itemMoment + pilotMoment + seatMoment + customMoment;
                const lateralCG = stats.totalWeight > 0 ? totalLateralMoment / stats.totalWeight : 0;
                // 호이스트 운용(호이스트 좌석 또는 HOIST 항목에 무게 입력) 시 점선 한계까지 허용
                const hoistOps = (varSeats.includes('HOIST') && (seatWeights.HOIST || 0) > 0)
                    || (stats.tableData.find(i => i.id === 'hoist')?.weight || 0) > 0;
                const poly = hoistOps ? LATERAL_HOIST_ENVELOPE[selectedAc] : LATERAL_ENVELOPE[selectedAc].standard;
                const limits = polyLimitsAt(poly, stats.totalWeight);
                const isWithinLimit = pointInPolygon(lateralCG, stats.totalWeight, poly);
                return { totalLateralMoment, lateralCG, isWithinLimit, limits, hoistOps, seatMoment, itemMoment, customMoment };
            }, [stats, selectedAc, seatWeights, customLateralItems, pilotArms, lateralPilotWeights, visibleSeats]);

            // 물탱크 상태 변경: 미장착→장착이면 펌프 자동 장착, 미장착으로 바꾸면 펌프 자동 해제(장착 중 펌프만 따로 떼기는 가능)
            const setWaterTank = (id, idx) => setItems(prev => {
                const wasOn = prev.find(i => i.id === id)?.isActive;
                const nowOn = idx !== 0;
                return prev.map(i => {
                    if (i.id === id) return { ...i, selectedIndex: idx, isActive: nowOn };
                    if (i.id === 'pump' && nowOn !== !!wasOn) return { ...i, isActive: nowOn };
                    if (i.id === 'cargo' && nowOn !== !!wasOn) return nowOn ? { ...i, weight: 0, isActive: false } : { ...i, isActive: true };   // 물탱크 장착 → 카고 미장착·0 / 해제 → 카고 복귀
                    return i;
                });
            });

            const updateItem = (id, field, value) => {
                // 카고에 무게 입력 → 물탱크·펌프 미장착 / 물탱크 장착 → 카고 0
                const cargoLoaded = id === 'cargo' && ((field === 'weight' && value > 0) || (field === 'isActive' && value === true));
                const tankOn = id === 'watertank' && field === 'isActive' && value === true;
                setItems(items.map(item => {
                    if (item.id === id) return { ...item, [field]: value };
                    if (cargoLoaded && (item.id === 'watertank' || item.id === 'pump')) return { ...item, isActive: false, ...(item.id === 'watertank' ? { selectedIndex: 0 } : {}) };
                    if (tankOn && item.id === 'cargo') return { ...item, weight: 0, isActive: false };
                    return item;
                }));
            };

            const moveItem = (index, direction) => {
                const newItems = [...items];
                const targetIndex = direction === 'up' ? index - 1 : index + 1;
                if (targetIndex < 0 || targetIndex >= newItems.length || newItems[index].isFixed || newItems[targetIndex].isFixed) return;
                [newItems[index], newItems[targetIndex]] = [newItems[targetIndex], newItems[index]];
                setItems(newItems);
            };

            const addNewItem = () => {
                setItems([...items, { id: `custom-${Date.now()}`, label: 'NEW ITEM', weight: 0, arm: 0, isFuel: false, isOptional: false, isActive: true }]);
            };

            const deleteItem = (id) => {
                if (id === 'bew') return;
                setItems(items.filter(item => item.id !== id));
            };

            const envelope = ENVELOPE_DATA[selectedAc];
            const dottedLines = useMemo(() => {
                const p4 = envelope.find(p => p.id === '4');
                const p5 = envelope.find(p => p.id === '5');
                const p9 = envelope.find(p => p.id === '9');
                const p10 = envelope.find(p => p.id === '10');
                return { line59: p5 && p9 ? [p5, p9] : [], line410: p4 && p10 ? [p4, p10] : [] };
            }, [selectedAc, envelope]);

            return (
                <div className="min-h-screen flex flex-col relative overflow-x-hidden">
                    {/* ── PDF 출력 확인 다이얼로그 ── */}
                    {showPrintDialog && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center no-print">
                            <div className="absolute inset-0 bg-black/40" onClick={() => setShowPrintDialog(false)}/>
                            <div className="relative bg-white rounded-2xl shadow-2xl border border-slate-200 p-5 w-64 z-10">
                                <button onClick={() => setShowPrintDialog(false)} className="absolute top-3 right-3 w-6 h-6 flex items-center justify-center rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 text-xs font-black">✕</button>
                                <div className="flex items-center gap-2 mb-1">
                                    <Icon name="file-text" size={16} className="text-blue-600"/>
                                    <p className="text-sm font-black text-slate-800">PDF 출력</p>
                                </div>
                                <p className="text-[11px] text-slate-500 mb-4">레터럴 CG 섹션을 포함할까요?</p>
                                <div className="flex gap-2">
                                    <button onClick={() => doPrint(false)}
                                            className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-black transition-all active:scale-95">미포함</button>
                                    <button onClick={() => doPrint(true)}
                                            className="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-black transition-all active:scale-95">포함</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/70 z-[100] flex items-center justify-center p-2 sm:p-4 backdrop-blur-md no-print">
                            <div className="bg-white rounded-2xl sm:rounded-3xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden modal-enter">
                                <div className="bg-slate-900 text-white px-5 sm:px-8 py-4 flex justify-between items-center">
                                    <div>
                                        <h3 className="font-black uppercase text-sm sm:text-base flex items-center gap-2">
                                            <Icon name="settings-2" className="text-blue-400" /> 리스트 제원 및 순서 수정
                                        </h3>
                                    </div>
                                    <button onClick={() => setIsModalOpen(false)} className="bg-white/10 hover:bg-white/20 p-2 rounded-full transition-all">
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 sm:p-8 bg-slate-50 custom-scrollbar space-y-3">
                                    {items.map((item, idx) => (
                                        <div key={item.id} className={`grid grid-cols-12 gap-2 sm:gap-3 items-center p-2 sm:p-3 rounded-xl border shadow-sm ${item.id === 'bew' ? 'bg-blue-50 border-blue-200' : 'bg-white border-slate-200'}`}>
                                            <div className="col-span-1 flex flex-col items-center gap-1">
                                                <button onClick={() => moveItem(idx, 'up')} disabled={idx === 0 || item.isFixed} className="text-slate-400 hover:text-blue-600 disabled:opacity-20"><Icon name="chevron-up" size={18} /></button>
                                                <button onClick={() => moveItem(idx, 'down')} disabled={idx === items.length - 1 || item.isFixed} className="text-slate-400 hover:text-blue-600 disabled:opacity-20"><Icon name="chevron-down" size={18} /></button>
                                            </div>
                                            <div className="col-span-11 sm:col-span-5">
                                                <input type="text" value={item.label} onChange={e => updateItem(item.id, 'label', e.target.value)} disabled={item.id === 'bew' || item.isDropdown} className={`w-full bg-transparent border-none rounded-lg px-2 py-1 text-sm font-bold focus:ring-1 focus:ring-blue-500 outline-none ${item.id === 'bew' ? 'text-blue-700' : ''}`} />
                                            </div>
                                            <div className="col-span-5 sm:col-span-2">
                                                <input type="number" value={item.weight} onChange={e => updateItem(item.id, 'weight', parseFloat(e.target.value) || 0)} disabled={item.isDropdown} className="w-full bg-slate-100/50 border-none rounded-lg px-2 py-1 text-xs sm:text-sm font-mono text-center focus:ring-1 focus:ring-blue-500 outline-none" />
                                            </div>
                                            <div className="col-span-5 sm:col-span-2">
                                                <input type="number" value={item.isFuel ? rfmFuelArm(item.weight).toFixed(3) : item.arm} title={item.isFuel ? 'RFM 연료 표에서 자동 계산' : undefined} onChange={e => updateItem(item.id, 'arm', parseFloat(e.target.value) || 0)} step="0.001" disabled={item.isDropdown || item.isFuel} className="w-full bg-slate-100/50 border-none rounded-lg px-2 py-1 text-xs sm:text-sm font-mono text-center focus:ring-1 focus:ring-blue-500 outline-none" />
                                            </div>
                                            <div className="col-span-2 flex justify-end gap-2 pr-1">
                                                {!item.isFixed && <button onClick={() => deleteItem(item.id)} className="text-rose-400 p-1"><Icon name="trash-2" size={16} /></button>}
                                            </div>
                                        </div>
                                    ))}
                                    <button onClick={addNewItem} className="w-full py-3 border-2 border-dashed border-slate-300 rounded-xl text-slate-400 font-black text-xs hover:bg-white transition-all uppercase tracking-widest">+ 신규 항목 추가</button>
                                </div>
                                <div className="bg-white px-5 py-4 border-t flex justify-end">
                                    <button onClick={() => setIsModalOpen(false)} className="w-full sm:w-auto px-12 py-3 bg-slate-900 text-white rounded-xl text-xs font-black shadow-lg">수정 완료</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="bg-slate-900 text-white px-4 sm:px-6 py-4 shadow-lg sticky top-0 z-50 print:relative print:bg-white print:text-black print:shadow-none print:border-b-2 print:border-slate-800">
                        <div className="max-w-7xl mx-auto w-full flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3 w-full sm:w-auto">
                                <div className="p-2 bg-blue-600 rounded-lg text-xl print:hidden">🚁</div>
                                <div>
                                    <h1 className="text-base sm:text-xl font-black tracking-tight uppercase leading-none">AW139 Weight & Balance</h1>
                                    <div className="flex items-center gap-3 mt-1.5 font-bold">
                                        <select value={selectedAc} onChange={(e) => setSelectedAc(e.target.value)} className="bg-slate-800 text-[10px] px-2 py-0.5 rounded print:hidden outline-none">
                                            <option value="HL9695">HL9695(7,000Kg)</option>
                                            <option value="HL9277">HL9277(6,400Kg)</option>
                                        </select>
